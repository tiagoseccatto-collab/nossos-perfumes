<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nossos Perfumes</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #c5a059;
            --text: #2c2c2c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.65)), 
                        url('https://i.pinimg.com/736x/02/92/5c/02925cc14951ba9be6e7fcafb4b03cb9.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            margin: 0;
            padding: 8px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 950px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 12px;
            color: #ffffff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        h1 {
            color: #f3e5ab;
            margin-bottom: 1px;
            font-size: 1.4rem;
            letter-spacing: 0.8px;
            font-weight: 700;
        }
        header p {
            color: #e2dcda;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            margin: 0;
        }
        .card {
            background: rgba(240, 240, 240, 0.88); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
            border-bottom: 1.5px solid #e5d394;
            padding-bottom: 4px;
            font-size: 0.95rem;
            font-weight: bold;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        form .full-width {
            grid-column: span 2;
        }
        label {
            font-weight: 600;
            font-size: 10.5px;
            color: #333;
            display: block;
            margin-bottom: 2px;
        }
        input[type="text"], select, input[type="url"] {
            width: 100%;
            padding: 7px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 12px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.95);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 4px rgba(197, 160, 89, 0.5);
            background: #ffffff;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 6px;
            background: rgba(248, 248, 248, 0.9);
            border: 1px solid #ccc;
            padding: 8px;
            border-radius: 6px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
            font-size: 11px;
            cursor: pointer;
            margin-bottom: 0;
            color: #222;
        }
        .checkbox-label input {
            cursor: pointer;
            width: 13px;
            height: 13px;
        }
        .form-actions {
            grid-column: span 2;
            display: flex;
            gap: 6px;
        }
        button.btn-submit {
            background-color: #1a1a1a;
            color: #f3e5ab;
            border: 1px solid #f3e5ab;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            transition: background-color 0.3s;
            margin-top: 4px;
        }
        button.btn-submit:hover {
            background-color: #333333;
        }
        button.btn-cancel {
            background-color: #777;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12.5px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            margin-top: 4px;
        }
        button.btn-cancel:hover {
            background-color: #555;
        }
        .filter-bar {
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .filter-bar select {
            background: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            font-size: 11px;
            padding: 6px;
        }
        #lista-perfumes {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 52vh;
            overflow-y: auto;
            padding-right: 3px;
        }
        #lista-perfumes::-webkit-scrollbar {
            width: 4px;
        }
        #lista-perfumes::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 3px;
        }
        #lista-perfumes::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 3px;
        }
        .perfume-card {
            background: rgba(240, 240, 240, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 9px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            display: flex;
            gap: 9px;
            align-items: flex-start;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .perfume-card-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
            flex-shrink: 0;
        }
        .perfume-card-info { flex: 1; min-width: 0; }
        .perfume-card h3 { margin: 0 0 2px 0; color: var(--primary); font-size: 0.95rem; word-break: break-word; }
        .perfume-card p { margin: 1px 0; font-size: 10.5px; color: #444; word-break: break-word; }
        .perfume-tags {
            display: flex;
            gap: 3px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .tag {
            background: #e5d394;
            color: #1a1a1a;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
        }
        .btn-action {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10.5px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            width: 58px;
            text-align: center;
        }
        .btn-edit {
            background-color: #c5a059;
            color: #1a1a1a;
        }
        .btn-edit:hover { background-color: #b08d47; }
        .btn-delete {
            background-color: #1a1a1a;
            color: #f3e5ab;
            border: 1px solid #f3e5ab;
        }
        .btn-delete:hover { background-color: #333; }
        #loading-msg {
            color: #fff;
            text-align: center;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 11.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        @media (max-width: 480px) {
            form {
                grid-template-columns: 1fr;
            }
            form .full-width {
                grid-column: span 1;
            }
            .filter-bar {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- SDKs do Firebase v10 com as suas credenciais -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCC0qDw7sLVou759xhnhhkHpKpLtSf9US4",
            authDomain: "nossos-perfumes.firebaseapp.com",
            projectId: "nossos-perfumes",
            storageBucket: "nossos-perfumes.firebasestorage.app",
            messagingSenderId: "143402748497",
            appId: "1:143402748497:web:fa2581d8df52b787ea0670"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('form-perfume');
        const formTitle = document.getElementById('form-title');
        const btnSubmit = document.getElementById('btn-submit');
        const btnCancel = document.getElementById('btn-cancel');
        const listaPerfumes = document.getElementById('lista-perfumes');
        const filtroOcasiao = document.getElementById('filtro-ocasiao');
        const filtroClima = document.getElementById('filtro-clima');
        const loadingMsg = document.getElementById('loading-msg');

        let perfumesCache = [];
        let editandoId = null;

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            btnSubmit.disabled = true;
            btnSubmit.textContent = editandoId ? 'Atualizando...' : 'Salvando...';

            try {
                const nome = document.getElementById('nome').value;
                const marca = document.getElementById('marca').value;
                const clima = document.getElementById('clima').value;
                const fixacao = document.getElementById('fixacao').value;
                const imagemUrl = document.getElementById('imagem-url').value.trim();
                
                const tiposSelecionados = [];
                document.querySelectorAll('#tipos-group input:checked').forEach(el => tiposSelecionados.push(el.value));

                const ocasioesSelecionadas = [];
                document.querySelectorAll('#ocasiao-group input:checked').forEach(el => ocasioesSelecionadas.push(el.value));

                const perfumeData = {
                    nome,
                    marca,
                    clima,
                    fixacao,
                    tipos: tiposSelecionados,
                    ocasioes: ocasioesSelecionadas,
                    imagem: imagemUrl,
                    atualizadoEm: Date.now()
                };

                if (editandoId) {
                    await updateDoc(doc(db, "perfumes", editandoId), perfumeData);
                    cancelarEdicao();
                } else {
                    perfumeData.criadoEm = Date.now();
                    await addDoc(collection(db, "perfumes"), perfumeData);
                    form.reset();
                }
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar o perfume. Verifique o console.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = editandoId ? 'Atualizar Perfume' : 'Salvar Perfume';
            }
        });

        window.editarPerfume = function(id) {
            const perfume = perfumesCache.find(p => p.id === id);
            if (!perfume) return;

            editandoId = id;
            document.getElementById('nome').value = perfume.nome;
            document.getElementById('marca').value = perfume.marca;
            document.getElementById('clima').value = perfume.clima;
            document.getElementById('fixacao').value = perfume.fixacao;
            document.getElementById('imagem-url').value = perfume.imagem || '';

            document.querySelectorAll('#tipos-group input').forEach(el => {
                el.checked = perfume.tipos && perfume.tipos.includes(el.value);
            });

            document.querySelectorAll('#ocasiao-group input').forEach(el => {
                el.checked = perfume.ocasioes && perfume.ocasioes.includes(el.value);
            });

            formTitle.textContent = 'Editar Perfume';
            btnSubmit.textContent = 'Atualizar Perfume';
            btnCancel.style.display = 'inline-block';

            form.scrollIntoView({ behavior: 'smooth' });
        };

        window.cancelarEdicao = function() {
            editandoId = null;
            form.reset();
            formTitle.textContent = 'Adicionar Novo Perfume';
            btnSubmit.textContent = 'Salvar Perfume';
            btnCancel.style.display = 'none';
        };

        btnCancel.addEventListener('click', cancelarEdicao);

        window.deletarPerfume = async function(id) {
            if (confirm("Deseja realmente excluir este perfume?")) {
                try {
                    await deleteDoc(doc(db, "perfumes", id));
                    if (editandoId === id) cancelarEdicao();
                } catch (error) {
                    console.error("Erro ao deletar:", error);
                }
            }
        };

        function renderizar() {
            listaPerfumes.innerHTML = '';

            perfumesCache.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));

            const ocFiltro = filtroOcasiao.value;
            const clFiltro = filtroClima.value;

            const filtrados = perfumesCache.filter(p => {
                const matchOcasiao = !ocFiltro || (p.ocasioes && p.ocasioes.includes(ocFiltro));
                const matchClima = !clFiltro || p.clima === clFiltro;
                return matchOcasiao && matchClima;
            });

            if (filtrados.length === 0) {
                listaPerfumes.innerHTML = '<div class="card" style="text-align: center; color: #555; font-size: 11px;">Nenhum perfume encontrado.</div>';
                return;
            }

            filtrados.forEach((p) => {
                const card = document.createElement('div');
                card.className = 'perfume-card';
                const imgExibida = p.imagem || 'https://via.placeholder.com/100?text=Sem+Foto';

                card.innerHTML = `
                    <img src="${imgExibida}" alt="Foto" class="perfume-card-img" onerror="this.src='https://via.placeholder.com/100?text=Erro'">
                    <div class="perfume-card-info">
                        <h3>${p.nome}</h3>
                        <p><strong>Marca:</strong> ${p.marca}</p>
                        <p><strong>Clima:</strong> ${p.clima}</p>
                        <p><strong>Fixação:</strong> ${p.fixacao}</p>
                        <div class="perfume-tags">
                            ${p.tipos ? p.tipos.map(t => `<span class="tag">${t}</span>`).join('') : ''}
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-action btn-edit" onclick="editarPerfume('${p.id}')">Editar</button>
                        <button class="btn-action btn-delete" onclick="deletarPerfume('${p.id}')">Deletar</button>
                    </div>
                `;
                listaPerfumes.appendChild(card);
            });
        }

        onSnapshot(collection(db, "perfumes"), (snapshot) => {
            perfumesCache = [];
            snapshot.forEach((docSnap) => {
                perfumesCache.push({ id: docSnap.id, ...docSnap.data() });
            });
            loadingMsg.style.display = 'none';
            renderizar();
        }, (error) => {
            console.error("Erro ao carregar dados:", error);
            loadingMsg.textContent = "Erro ao conectar com o banco de dados na nuvem.";
        });

        filtroOcasiao.addEventListener('change', renderizar);
        filtroClima.addEventListener('change', renderizar);
    </script>
</head>
<body>

<div class="container">
    <header>
        <h1>Nossos Perfumes</h1>
        <p>Indicações de uso</p>
    </header>

    <div class="card">
        <h2 id="form-title">Adicionar Novo Perfume</h2>
        <form id="form-perfume">
            <div>
                <label>Nome do Perfume *</label>
                <input type="text" id="nome" required placeholder="Ex: Club de Nuit">
            </div>
            <div>
                <label>Marca *</label>
                <input type="text" id="marca" required placeholder="Ex:
